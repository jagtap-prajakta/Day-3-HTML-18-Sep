<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arial</title>
    <style>
        p{
            font-family: Arial;
            text-align: center;
            margin-top: 0;
            margin-bottom: 0;
        }
        .heading{
            font-size: 30px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .content{
            margin-bottom: 20px;
        }
        .link{
            color: rgb(58, 108, 199);
        }
    </style>
</head>
<body>
    <p class="heading">Shopping for your business?</p>
    <p class="content"> See how Apple at Work can help.</p>
    <p class="link">Learn more ></p>
</body>
</html>
